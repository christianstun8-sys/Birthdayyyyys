name: Update Bot Server History Graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios

      - name: Fetch Stats & Generate Graph
        env:
          TOPGG_TOKEN: \${{ secrets.TOPGG_TOKEN }}
        run: |
          node -e '
          const fs = require("fs");
          const axios = require("axios");

          async function main() {
            const botId = "1389267222261792868";
            const historyFile = "bot_history.json";
            const outputFile = "bot_growth.png";

            let serverCount = 0;
            try {
              const headers = {
                "User-Agent": "GitHubActions-BotStatsFetcher/1.0"
              };
              if (process.env.TOPGG_TOKEN) {
                headers["Authorization"] = process.env.TOPGG_TOKEN;
              }

              const res = await axios.get(`https://top.gg/api/v2/bots/${botId}`, { headers });
              serverCount = res.data.server_count || res.data.monthlyPoints || 0;
              console.log("Abgerufener Server-Count:", serverCount);
            } catch (err) {
              console.warn("API Abruf fehlgeschlagen:", err.response ? err.response.data : err.message);
            }

            const today = new Date().toISOString().split("T")[0];

            let history = [];
            if (fs.existsSync(historyFile)) {
              try {
                history = JSON.parse(fs.readFileSync(historyFile, "utf8"));
              } catch (e) {
                history = [];
              }
            }

            const existingIndex = history.findIndex(entry => entry.date === today);
            if (existingIndex !== -1) {
              history[existingIndex].servers = serverCount;
            } else {
              history.push({ date: today, servers: serverCount });
            }

            if (history.length > 30) history = history.slice(-30);
            fs.writeFileSync(historyFile, JSON.stringify(history, null, 2));

            const chartConfig = {
              type: "line",
              data: {
                labels: history.map(h => h.date.slice(5)),
                datasets: [{
                  label: "Server Count",
                  data: history.map(h => h.servers),
                  borderColor: "#7289da",
                  backgroundColor: "rgba(114, 137, 218, 0.2)",
                  fill: true,
                  tension: 0.3
                }]
              },
              options: {
                title: { display: true, text: "Bot Server Growth (Top.gg)" },
                scales: {
                  yAxes: [{
                    ticks: {
                      precision: 0,
                      beginAtZero: true
                    }
                  }]
                }
              }
            };

            const chartUrl = `https://quickchart.io/chart?c=${encodeURIComponent(JSON.stringify(chartConfig))}`;
          
            const response = await axios.get(chartUrl, { responseType: "arraybuffer" });
            fs.writeFileSync(outputFile, Buffer.from(response.data));
            console.log("Dateien erfolgreich geschrieben!");
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_history.json bot_growth.png
          git commit -m "update: bot growth graph" || echo "Keine Änderungen zum Committen"
          git push